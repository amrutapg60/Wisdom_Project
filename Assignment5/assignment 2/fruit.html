<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Mosaic</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<div class="fruit">
    <img class="grapes"     src="images/grapes.svg"      alt="Grapes">
    <img class="strawberry" src="images/strawberry.svg"  alt="Strawberries">
    <img class="grapefruit" src="images/grapefruit.svg"  alt="Grapefruit">
    <img class="watermelon" src="images/watermelon.svg"  alt="Watermelon">
    <img class="papaya"     src="images/papaya.svg"      alt="Papaya">
    <img class="pineapple"  src="images/pineapple.svg"   alt="Pineapple">
  </div>
</main>
</body>
</html>
