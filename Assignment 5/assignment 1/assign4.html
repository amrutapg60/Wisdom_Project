<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Layout</title>
    <link rel="stylesheet" href="assignment4.css">
</head>
<body>

    <div class="dashboard">

        <header>My Dashboard</header>

        <nav>
            <h3>Navigation</h3>
            <p>Home</p>
            <p>Profile</p>
            <p>Settings</p>
            <p>Reports</p>
        </nav>

        <main>
            <h2>Welcome to Dashboard</h2>

            <div class="card">
                <h3>Total Users</h3>
                <p>1500</p>
            </div>

            <div class="card">
                <h3>Total Sales</h3>
                <p>250</p>
            </div>
        </main>

        <aside>
            <h3>Notifications</h3>
            <p>New updates available.</p>
            <p>Check your latest reports.</p>
        </aside>

        <footer>Dashboard © 2026</footer>

    </div>

</body>
</html>
