<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 1 - Register</title>
  <link rel="stylesheet" href="assignment1.css">
</head>
<body>
  <main class="register-card">
    <h1>Register</h1>
    <p class="intro">Kindly fill in this form to register.</p>
    <form onsubmit="event.preventDefault(); alert('Registration submitted!');">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" placeholder="Enter username" required>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="Enter Email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Enter Password" required>
      <label for="repeat-password">Repeat Password</label>
      <input id="repeat-password" name="repeat-password" type="password" placeholder="Repeat Password" required>
      <button type="submit">Register</button>
    </form>
    <p class="login-note">Already have an account? <a href="#">Log in</a>.</p>
  </main>
</body>
</html>
